name: Production CI & Acceptance Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies from lockfile
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.lock
        pip install --no-deps .
        mkdir -p .venv/bin
        ln -s "$(which python)" .venv/bin/python3
        ln -s "$(which python)" .venv/bin/python
        ln -s "$(which pytest)" .venv/bin/pytest
        ln -s "$(which alembic)" .venv/bin/alembic

    - name: Run Pytest Suite
      run: |
        pytest -v tests/ --ignore=tests/test_idempotency.py --ignore=tests/test_metrics_integrity.py

    - name: Run Full Acceptance Gate
      run: |
        bash tests/acceptance_tests.sh
