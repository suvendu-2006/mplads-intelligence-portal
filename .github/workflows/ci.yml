name: Production CI & Acceptance Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install . pydantic-settings pytest
        pip install -e .

    - name: Run Pytest Suite
      run: |
        pytest -v tests/test_settings.py tests/test_detector_registry.py tests/test_rbac_server_side.py tests/test_data_validation.py tests/test_alerting.py

    - name: Run Acceptance Gate
      run: |
        bash tests/acceptance_tests.sh
