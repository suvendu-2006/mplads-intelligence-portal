[project]
name = "mplads-fraud-detection"
version = "1.0.0"
description = "MPLADS Anomaly Screening and Audit Triage System"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "sqlalchemy>=2.0.0",
    "streamlit>=1.30.0",
    "alembic>=1.13.0",
    "pandera>=0.18.0",
    "pytest>=7.4.0",
    "ruff>=0.2.0",
    "sentence-transformers>=2.2.0",
    "python-dotenv>=1.0.0",
    "bcrypt>=4.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "psycopg2-binary>=2.9.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
