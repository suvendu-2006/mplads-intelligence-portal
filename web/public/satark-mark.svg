<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldOuterLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1736" />
      <stop offset="100%" stop-color="#17306E" />
    </linearGradient>
    <linearGradient id="shieldOuterRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142961" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="innerCrestLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="innerCrestRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="emeraldCheck" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Outer Sapphire Sovereign Shield with Gold Rim (No outer box, no circles) -->
  <path d="M32 3 L57 12 V31 C57 46.5 46.2 57.4 32 61.5 C17.8 57.4 7 46.5 7 31 V12 Z" fill="url(#shieldOuterLeft)" />
  <path d="M32 3 L57 12 V31 C57 46.5 46.2 57.4 32 61.5 Z" fill="url(#shieldOuterRight)" opacity="0.85" />
  <path d="M32 3 L57 12 V31 C57 46.5 46.2 57.4 32 61.5 C17.8 57.4 7 46.5 7 31 V12 Z" fill="none" stroke="url(#goldBorder)" stroke-width="3.2" stroke-linejoin="round" />

  <!-- Inner Dual-Faceted Porcelain Crest -->
  <path d="M32 13 L16 19 V31.5 C16 41.8 22.8 49.4 32 52.8 Z" fill="url(#innerCrestLeft)" />
  <path d="M32 13 L48 19 V31.5 C48 41.8 41.2 49.4 32 52.8 Z" fill="url(#innerCrestRight)" />

  <!-- Crisp Emerald Audit Checkmark -->
  <path d="M23 33 L29.5 39.5 L42 25.5" fill="none" stroke="url(#emeraldCheck)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Top Gold Diamond Crest -->
  <polygon points="32,16.5 35,20.2 32,24 29,20.2" fill="#F59E0B" />
</svg>
