<html lang="en" data-theme="light">

    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />

    <meta name="theme-color" content="#1E3A8A" />

    <!-- DNS Prefetch & Preconnect for Super Fast Connection Setup -->
    <meta http-equiv="x-dns-prefetch-control" content="on" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Oriya:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Sans+Gujarati:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Sans+Malayalam:wght@400;600;700&family=Noto+Sans+Gurmukhi:wght@400;600;700&display=swap" />

    <!-- Open Graph / Meta Preview for URL Links -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SATARK-MPLADS | National Intelligence &amp; Forensic Command Center" />
    <meta property="og:description" content="AI-driven forensic surveillance, multi-tiered anomaly detection (D1–D15), and transparent analytics for MPLADS funds across 543 Constituencies and 732+ Districts." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SATARK-MPLADS | National Intelligence &amp; Forensic Command Center" />
    <meta name="twitter:description" content="AI-driven forensic surveillance, multi-tiered anomaly detection (D1–D15), and transparent analytics for MPLADS funds across 543 Constituencies and 732+ Districts." />

    <!-- Default strictly to Light Mode unless explicitly set to dark in session v7 -->
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('mplads-user-session');
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.version >= 7 && parsed.state && parsed.state.theme === 'dark') {
              document.documentElement.setAttribute('data-theme', 'dark');
              document.documentElement.classList.add('dark');
              return;
            }
          }
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.classList.remove('dark');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
