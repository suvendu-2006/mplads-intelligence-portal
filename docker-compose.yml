services:
  db:
    image: postgres:15-alpine
    container_name: mplads_db
    environment:
      POSTGRES_DB: mplads_prod
      POSTGRES_USER: mplads_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/ssl:/var/lib/postgresql/ssl:ro
    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/ssl/server.crt
      -c ssl_key_file=/var/lib/postgresql/ssl/server.key
    networks:
      - mplads_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mplads_user -d mplads_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: mplads_web
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://mplads_user:${DB_PASSWORD}@db:5432/mplads_prod?sslmode=require
      SECRET_KEY: ${SECRET_KEY}
      DB_PASSWORD: ${DB_PASSWORD}
      ML_PREDICTIONS_ENABLED: "false"
      DEMO_MODE: "false"
    ports:
      - "8501:8501"
    networks:
      - mplads_internal
    restart: on-failure:3

networks:
  mplads_internal:
    driver: bridge

volumes:
  postgres_data:
